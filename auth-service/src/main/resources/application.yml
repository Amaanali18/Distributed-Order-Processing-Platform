server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5433/dpp_auth}
    username: ${POSTGRES_USER:dpp}
    password: ${POSTGRES_PASSWORD:dpp}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

dpp:
  jwt:
    issuer: ${JWT_ISSUER:dpp-auth}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  bootstrap:
    admin-email: ${DPP_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${DPP_BOOTSTRAP_ADMIN_PASSWORD:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
