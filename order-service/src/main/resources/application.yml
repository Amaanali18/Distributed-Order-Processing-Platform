server:
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5433/dpp_orders}
    username: ${POSTGRES_USER:dpp}
    password: ${POSTGRES_PASSWORD:dpp}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

spring.cloud.openfeign:
  circuitbreaker:
    enabled: true
  client:
    config:
      default:
        connect-timeout: ${FEIGN_CONNECT_TIMEOUT_MS:2000}
        read-timeout: ${FEIGN_READ_TIMEOUT_MS:5000}

resilience4j:
  circuitbreaker:
    instances:
      catalog-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        register-health-indicator: true
  retry:
    instances:
      catalog-service:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - feign.RetryableException
          - java.util.concurrent.TimeoutException
  timelimiter:
    instances:
      catalog-service:
        timeout-duration: 5s
        cancel-running-future: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,retries,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
    retries:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs

dpp:
  internal:
    service-token: ${DPP_INTERNAL_SERVICE_TOKEN:dpp-internal-dev-token}
  orders:
    # Keep this shorter than the catalog reservation TTL (15 min) so an unpaid
    # reservation is cancelled before its stock is swept back into circulation.
    payment-timeout-ms: ${ORDER_PAYMENT_TIMEOUT_MS:600000}
    expiry-sweep-interval-ms: ${ORDER_EXPIRY_SWEEP_INTERVAL_MS:60000}
  outbox:
    poll-interval-ms: 500
