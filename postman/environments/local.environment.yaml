name: Local
values:
  - key: base_url
    value: 'http://localhost:8080'
    enabled: true
    type: default
    description: Local API gateway base URL.
  - key: auth_service_url
    value: 'http://localhost:8081'
    enabled: true
    type: default
    description: Direct auth-service URL for the non-gateway JWKS endpoint.
  - key: catalog_service_url
    value: 'http://localhost:8082'
    enabled: true
    type: default
    description: Direct catalog-service URL for /internal inventory requests.
  - key: order_service_url
    value: 'http://localhost:8083'
    enabled: true
    type: default
    description: Direct order-service URL for /internal order requests.
  - key: admin_email
    value: 'admin@dpp.local'
    enabled: true
    type: default
    description: Placeholder admin email for the local admin bootstrap.
  - key: admin_password
    value: 'replace-with-admin-password'
    enabled: true
    type: default
    description: Placeholder only; set a local value before running.
  - key: customer_email
    value: 'customer@dpp.local'
    enabled: true
    type: default
    description: Overwritten with a unique address by the register pre-request script.
  - key: customer_password
    value: 'replace-with-customer-password'
    enabled: true
    type: default
    description: Overwritten by the register pre-request script when running the collection.
  - key: idempotency_key
    value: 'local-demo-key-change-me'
    enabled: true
    type: default
    description: Idempotency-Key for POST /payments.
  - key: internal_token
    value: 'replace-with-local-internal-token'
    enabled: true
    type: default
    description: Placeholder for X-Internal-Service-Token; match dpp.internal.service-token locally.
  - key: product_id
    value: '00000000-0000-0000-0000-000000000000'
    enabled: true
    type: default
    description: Populated by the products-list assertion.
  - key: product_sku
    value: ''
    enabled: true
    type: default
    description: Generated by the create-product pre-request script.
  - key: order_id
    value: '00000000-0000-0000-0000-000000000000'
    enabled: true
    type: default
    description: Populated by the create-order assertion.
  - key: payment_id
    value: '00000000-0000-0000-0000-000000000000'
    enabled: true
    type: default
    description: Populated by the create-payment assertion.
  - key: notification_id
    value: '00000000-0000-0000-0000-000000000000'
    enabled: true
    type: default
    description: Populated by the customer notifications-list assertion.
  - key: webhook_event_id
    value: 'evt_local_demo'
    enabled: true
    type: default
    description: Dummy event id for the no-op webhook sample.
  - key: payment_amount
    value: '12.50'
    enabled: true
    type: default
    description: Sample payment amount.
  - key: currency
    value: 'USD'
    enabled: true
    type: default
    description: Sample currency.
