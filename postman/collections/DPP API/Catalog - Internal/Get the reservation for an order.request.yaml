$kind: http-request
description: Service-to-service only. Not routed through the gateway.
url: "{{catalog_service_url}}/internal/inventory/reservations/:orderId"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: orderId
    value: '{{order_id}}'
    disabled: false
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: X-Internal-Service-Token
    value: "{{internal_token}}"
    in: header
settings: {}
examples: ./.resources/Get the reservation for an order.resources/examples
order: 2000
