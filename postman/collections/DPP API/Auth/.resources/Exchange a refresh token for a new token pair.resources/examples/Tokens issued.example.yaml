$kind: http-example
request:
  url: "{{base_url}}/auth/refresh"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "refreshToken": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "accessToken": "string",
        "refreshToken": "string",
        "tokenType": "Bearer",
        "expiresIn": 391
      }
order: 1000
