$kind: http-example
request:
  url: "{{base_url}}/auth/register"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "email": "ybklF2PV@YmMTFeVnSwCy.jm",
        "password": "stringstring"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "999d882f-1c40-5111-903a-fc487363f140",
        "email": "string",
        "roles": [
          "string",
          "string"
        ]
      }
order: 1000
