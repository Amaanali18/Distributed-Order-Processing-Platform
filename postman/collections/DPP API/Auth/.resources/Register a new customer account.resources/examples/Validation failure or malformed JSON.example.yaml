    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "timestamp": "1957-09-22T21:36:29.465Z",
        "status": 8203,
        "error": "string",
        "code": "NOT_FOUND",
        "message": "string",
        "path": "string",
        "correlationId": "string",
        "violations": [
          {
            "field": "string",
            "message": "string"
          },
          {
            "field": "string",
            "message": "string"
          }
        ]
      }
order: 2000
