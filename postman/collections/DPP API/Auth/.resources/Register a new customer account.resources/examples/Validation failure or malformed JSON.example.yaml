$kind: http-example
request:
  url: "{{base_url}}/auth/register"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "email": "ybklF2PV@YmMTFeVnSwCy.jm",
        "password": "stringstring"
      }
