$kind: http-example
request:
  url: "{{base_url}}/auth/me"
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "657c3932-709b-f5e4-33b1-0722a897cd02",
        "email": "string",
        "roles": [
          "string",
          "string"
        ]
      }
order: 1000
