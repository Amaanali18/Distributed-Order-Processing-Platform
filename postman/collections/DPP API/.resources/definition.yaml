$kind: collection
name: DPP API
description: |-
  Local-only Postman v3 collection generated from postman/specs/dpp-api.yaml
  and then extended with runnable variables and afterResponse assertions.
  Nothing in this repository was pushed or published to a Postman workspace.

  Service folders mirror the implemented services. Requests under internal/
  folders are service-to-service only and are not routed through the gateway.
variables:
  - key: base_url
    value: 'http://localhost:8080'
    description: Local API gateway base URL.
  - key: auth_service_url
    value: 'http://localhost:8081'
    description: Direct auth-service URL for the non-gateway JWKS endpoint.
  - key: catalog_service_url
    value: 'http://localhost:8082'
    description: Direct catalog-service URL for /internal inventory requests.
  - key: order_service_url
    value: 'http://localhost:8083'
    description: Direct order-service URL for /internal order requests.
  - key: admin_email
    value: 'admin@dpp.local'
    description: Placeholder admin email; override in the local environment.
  - key: admin_password
    value: 'replace-with-admin-password'
    description: Placeholder admin password; never commit a real credential.
  - key: customer_email
    value: 'customer@dpp.local'
    description: Placeholder customer email; override in the local environment.
  - key: customer_password
    value: 'replace-with-customer-password'
    description: Placeholder customer password; never commit a real credential.
  - key: idempotency_key
    value: 'local-demo-key-change-me'
    description: Idempotency-Key used by POST /payments.
  - key: internal_token
    value: 'replace-with-local-internal-token'
    description: Placeholder for X-Internal-Service-Token on /internal/** requests.
  - key: product_id
    value: '00000000-0000-0000-0000-000000000000'
    description: Product id populated by the active-products assertion.
  - key: product_sku
    value: ''
    description: Unique SKU generated by the create-product pre-request script.
  - key: order_id
    value: '00000000-0000-0000-0000-000000000000'
    description: Order id populated by the create-order assertion.
  - key: payment_id
    value: '00000000-0000-0000-0000-000000000000'
    description: Payment id populated by the create-payment assertion.
  - key: notification_id
    value: '00000000-0000-0000-0000-000000000000'
    description: Notification id populated by the customer notifications list.
  - key: webhook_event_id
    value: 'evt_local_demo'
    description: Dummy webhook event id; the sample uses an unhandled type.
  - key: payment_amount
    value: '12.50'
    description: Amount used by the sample payment request.
  - key: currency
    value: 'USD'
    description: Currency used by sample product/payment requests.
  - key: customerToken
    value: ''
    description: Access token stored by the customer login assertion.
  - key: refreshToken
    value: ''
    description: Refresh token stored by the customer login assertion.
  - key: adminToken
    value: ''
    description: Access token stored by the admin login assertion.
auth:
  type: bearer
  credentials:
    token: '{{customerToken}}'
