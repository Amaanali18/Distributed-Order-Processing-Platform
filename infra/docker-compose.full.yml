# Complete local full-stack deployment (infrastructure + all services + frontend).
# Run from anywhere in the repo (compose resolves build contexts relative to infra/):
#
#   START (build images, create volumes, detach):
#     docker compose -f infra/docker-compose.full.yml up -d --build
#
#   STOP (keep database volumes):
#     docker compose -f infra/docker-compose.full.yml down
#
#   STOP + RESET (also deletes all database volumes and starts from scratch):
#     docker compose -f infra/docker-compose.full.yml down -v
#
#   VALIDATE WITHOUT STARTING:
#     docker compose -f infra/docker-compose.full.yml config --services
#
# Endpoints: frontend http://localhost:3000 | gateway http://localhost:8080
#            eureka http://localhost:8761 | postgres localhost:5433 | kafka localhost:9092

name: dpp

# Shared by the one-shot volume fixer and auth-service so both build the same image.
x-auth-build: &auth-build
  context: ..
  dockerfile: auth-service/Dockerfile

services:
  # ---------------------------------------------------------------- infrastructure
  postgres:
    image: postgres:16-alpine
    container_name: dpp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dpp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dpp}
      POSTGRES_DB: dpp
    ports:
      - "5433:5432"
    volumes:
      - dpp-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dpp} -d dpp"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - dpp

  redis:
    image: redis:7-alpine
    container_name: dpp-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - dpp

  kafka:
    image: apache/kafka:3.9.0
    container_name: dpp-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - dpp

  # ---------------------------------------------------------------- discovery
  discovery-server:
    build:
      context: ..
      dockerfile: discovery-server/Dockerfile
    image: dpp/discovery-server:local
    container_name: dpp-discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - dpp

  # ---------------------------------------------------------------- jwt key volume
  # Named volumes created before auth-service ran as dpp are root-owned. Fix them
  # once before auth starts; fresh volumes already inherit /keys ownership from
  # the image, and this chown is harmless in that case.
  auth-jwk-init:
    build: *auth-build
    image: dpp/auth-service:local
    container_name: dpp-auth-jwk-init
    user: root
    entrypoint: ["sh", "-c", "mkdir -p /keys && chown -R dpp:dpp /keys && chmod 700 /keys"]
    volumes:
      - dpp-auth-jwk:/keys
    restart: "no"

  # ---------------------------------------------------------------- gateway
  api-gateway:
    build:
      context: ..
      dockerfile: api-gateway/Dockerfile
    image: dpp/api-gateway:local
    container_name: dpp-api-gateway
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka
      AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GATEWAY_RATE_LIMIT_REPLENISH_RATE: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:-20}
      GATEWAY_RATE_LIMIT_BURST_CAPACITY: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:-40}
    ports:
      - "8080:8080"
    depends_on:
      discovery-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - dpp

  # ---------------------------------------------------------------- applications
  auth-service:
    build: *auth-build
    image: dpp/auth-service:local
    container_name: dpp-auth-service
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dpp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dpp}
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/dpp_auth
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka
      JWT_ISSUER: ${JWT_ISSUER:-dpp-auth}
      JWT_JWK_PATH: /keys/auth-jwk.json
      JWT_GENERATE_IF_MISSING: ${JWT_GENERATE_IF_MISSING:-true}
      DPP_BOOTSTRAP_ADMIN_EMAIL: ${DPP_BOOTSTRAP_ADMIN_EMAIL:-admin@dpp.local}
      DPP_BOOTSTRAP_ADMIN_PASSWORD: ${DPP_BOOTSTRAP_ADMIN_PASSWORD:-AdminPass123!}
    volumes:
      - dpp-auth-jwk:/keys
    ports:
      - "8081:8081"
    depends_on:
      auth-jwk-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - dpp

  catalog-service:
    build:
      context: ..
      dockerfile: catalog-service/Dockerfile
    image: dpp/catalog-service:local
    container_name: dpp-catalog-service
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dpp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dpp}
      CATALOG_DB_URL: jdbc:postgresql://postgres:5432/dpp_catalog
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka
      AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      DPP_INTERNAL_SERVICE_TOKEN: ${DPP_INTERNAL_SERVICE_TOKEN:-dpp-internal-dev-token}
      CATALOG_RESERVATION_SWEEP_INTERVAL_MS: ${CATALOG_RESERVATION_SWEEP_INTERVAL_MS:-60000}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - dpp

  order-service:
    build:
      context: ..
      dockerfile: order-service/Dockerfile
    image: dpp/order-service:local
    container_name: dpp-order-service
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dpp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dpp}
      ORDER_DB_URL: jdbc:postgresql://postgres:5432/dpp_orders
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka
      AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      DPP_INTERNAL_SERVICE_TOKEN: ${DPP_INTERNAL_SERVICE_TOKEN:-dpp-internal-dev-token}
      FEIGN_CONNECT_TIMEOUT_MS: ${FEIGN_CONNECT_TIMEOUT_MS:-2000}
      FEIGN_READ_TIMEOUT_MS: ${FEIGN_READ_TIMEOUT_MS:-5000}
      ORDER_PAYMENT_TIMEOUT_MS: ${ORDER_PAYMENT_TIMEOUT_MS:-600000}
      ORDER_EXPIRY_SWEEP_INTERVAL_MS: ${ORDER_EXPIRY_SWEEP_INTERVAL_MS:-60000}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - dpp

  payment-service:
    build:
      context: ..
      dockerfile: payment-service/Dockerfile
    image: dpp/payment-service:local
    container_name: dpp-payment-service
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dpp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dpp}
      PAYMENT_DB_URL: jdbc:postgresql://postgres:5432/dpp_payments
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka
      AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      DPP_INTERNAL_SERVICE_TOKEN: ${DPP_INTERNAL_SERVICE_TOKEN:-dpp-internal-dev-token}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-simulated}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_API_BASE: ${STRIPE_API_BASE:-https://api.stripe.com}
      STRIPE_CONNECT_TIMEOUT_MS: ${STRIPE_CONNECT_TIMEOUT_MS:-2000}
      STRIPE_READ_TIMEOUT_MS: ${STRIPE_READ_TIMEOUT_MS:-5000}
      PAYMENT_RECONCILE_INTERVAL_MS: ${PAYMENT_RECONCILE_INTERVAL_MS:-60000}
      PAYMENT_RECONCILE_STALE_MS: ${PAYMENT_RECONCILE_STALE_MS:-120000}
      PAYMENT_CB_WINDOW: ${PAYMENT_CB_WINDOW:-20}
      PAYMENT_CB_MIN_CALLS: ${PAYMENT_CB_MIN_CALLS:-10}
      PAYMENT_CB_FAILURE_RATE: ${PAYMENT_CB_FAILURE_RATE:-50}
      PAYMENT_CB_OPEN_MS: ${PAYMENT_CB_OPEN_MS:-10000}
      PAYMENT_CB_SLOW_MS: ${PAYMENT_CB_SLOW_MS:-3000}
      PAYMENT_CB_HALF_OPEN: ${PAYMENT_CB_HALF_OPEN:-5}
      PAYMENT_RETRY_MAX: ${PAYMENT_RETRY_MAX:-3}
      PAYMENT_RETRY_WAIT_MS: ${PAYMENT_RETRY_WAIT_MS:-300}
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - dpp

  notification-service:
    build:
      context: ..
      dockerfile: notification-service/Dockerfile
    image: dpp/notification-service:local
    container_name: dpp-notification-service
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dpp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dpp}
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/dpp_notifications
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka
      AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      DPP_INTERNAL_SERVICE_TOKEN: ${DPP_INTERNAL_SERVICE_TOKEN:-dpp-internal-dev-token}
      DPP_NOTIFICATION_SENDER: ${DPP_NOTIFICATION_SENDER:-log}
      DPP_NOTIFICATION_FROM: ${DPP_NOTIFICATION_FROM:-no-reply@dpp.local}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Spring Boot mail auto-configuration binds SPRING_MAIL_*, not SMTP_*.
      SPRING_MAIL_HOST: ${SMTP_HOST:-}
      SPRING_MAIL_PORT: ${SMTP_PORT:-25}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - dpp

  # ---------------------------------------------------------------- frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: dpp/frontend:local
    container_name: dpp-frontend
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - dpp

volumes:
  dpp-postgres-data:
  dpp-auth-jwk:

networks:
  dpp:
    name: dpp
